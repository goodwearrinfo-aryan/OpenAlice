<!doctype html><html><head><meta charset="utf-8"><title>Pairs BTC/ETH — market-neutral</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{background:#0b0e14;color:#cdd6f4;font:14px/1.5 ui-monospace,Menlo,monospace;margin:0;padding:20px}
 h1{font-size:18px;margin:0 0 4px}.sub{color:#7f849c;font-size:12px;margin-bottom:16px}
 .cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px}
 .card{background:#11141c;border:1px solid #1e2230;border-radius:10px;padding:12px 16px;min-width:120px}
 .card .k{color:#7f849c;font-size:11px;text-transform:uppercase}.card .v{font-size:22px;margin-top:3px}
 .pos{color:#a6e3a1}.neg{color:#f38ba8}.mut{color:#7f849c}
 table{width:100%;border-collapse:collapse;margin-top:6px}
 th,td{text-align:right;padding:6px 10px;border-bottom:1px solid #181b25}
 th{color:#7f849c;font-size:11px;text-transform:uppercase}td:first-child,th:first-child{text-align:left}
 .tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#1e2230}
 .zbar{position:relative;height:30px;background:#11141c;border:1px solid #1e2230;border-radius:8px;margin:6px 0 14px}
 .zmid{position:absolute;left:50%;top:0;bottom:0;width:1px;background:#45475a}
 .zband{position:absolute;top:0;bottom:0;width:1px;background:#f9e2af66}
 .zdot{position:absolute;top:5px;width:18px;height:18px;border-radius:50%;background:#89b4fa;transform:translateX(-9px);transition:left .4s}
 .warn{color:#f9e2af;font-size:11px;margin-top:12px}
</style></head><body>
<h1>⚖️ Pairs BTC/ETH <span class="mut">— market-neutral mean-reversion</span></h1>
<div class="sub">long the cheap coin / short the rich coin on the ratio z-score · dollar-neutral · <span id="age"></span></div>
<div class="cards" id="cards"></div>
<div class="mut" style="font-size:11px">z-score (enter at ±2, exit at ±0.5):</div>
<div class="zbar"><div class="zmid"></div>
 <div class="zband" style="left:0%"></div><div class="zband" style="left:12.5%"></div>
 <div class="zband" style="left:87.5%"></div><div class="zband" style="left:100%"></div>
 <div class="zdot" id="zdot" style="left:50%"></div></div>
<table><thead><tr><th>leg</th><th>side</th><th>qty</th><th>notional</th><th>uPnL</th></tr></thead><tbody id="rows"></tbody></table>
<div class="warn" id="note"></div>
<script>
const $=id=>document.getElementById(id), cls=v=>v>0?'pos':v<0?'neg':'mut', sgn=v=>(v>0?'+':'')+(+v).toLocaleString(undefined,{maximumFractionDigits:2});
async function load(){
 let d; try{ d=await (await fetch('pairs.json?t='+Date.now())).json() }catch(e){ $('cards').innerHTML='feed unavailable'; return }
 $('age').textContent='updated '+new Date(d.ts*1000).toLocaleTimeString();
 let net=0; (d.positions||[]).forEach(p=>{const u=(+p.qty)*(+p.mark); net+=(p.side==='long'?u:-u);});
 $('cards').innerHTML=[
  ['z-score',(d.z>0?'+':'')+d.z,Math.abs(d.z)>=2?'neg':'mut'],
  ['State',d.state||'FLAT',(d.state&&d.state!=='FLAT')?'pos':'mut'],
  ['Equity','$'+(+d.equity).toLocaleString(),''],
  ['P&L','$'+sgn(d.pnl),cls(d.pnl)],
  ['Net $ exposure','$'+Math.round(net).toLocaleString(),Math.abs(net)<1000?'pos':'neg'],
 ].map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v ${c[2]}">${c[1]}</div></div>`).join('');
 const zp=Math.max(0,Math.min(100, 50 + (d.z/4)*50));  // map z in [-4,4] to 0-100%
 $('zdot').style.left=zp+'%'; $('zdot').style.background=Math.abs(d.z)>=2?'#f38ba8':'#89b4fa';
 $('rows').innerHTML=(d.positions||[]).map(p=>{const u=(+p.qty)*(+p.mark);return
  `<tr><td>${p.coin}</td><td><span class="tag">${(p.side||'').toUpperCase()}</span></td><td>${p.qty}</td><td>$${Math.round(u).toLocaleString()}</td><td class="${cls(p.uPnL)}">$${sgn(p.uPnL)}</td></tr>`;}).join('') || '<tr><td colspan=5 class=mut>flat — waiting for |z| > 2</td></tr>';
 $('note').textContent='⚠ '+(d.note||'');
}
load(); setInterval(load, 8000);
</script></body></html>
