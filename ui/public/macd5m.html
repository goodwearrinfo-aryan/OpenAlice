<!doctype html><html><head><meta charset="utf-8"><title>MACD 5m — P&L</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
 body{background:#0b0e14;color:#cdd6f4;font:14px/1.5 ui-monospace,Menlo,monospace;margin:0;padding:20px}
 h1{font-size:18px;margin:0 0 4px}.sub{color:#7f849c;font-size:12px;margin-bottom:16px}
 .cards{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px}
 .card{background:#11141c;border:1px solid #1e2230;border-radius:10px;padding:12px 16px;min-width:120px}
 .card .k{color:#7f849c;font-size:11px;text-transform:uppercase}.card .v{font-size:22px;margin-top:3px}
 .pos{color:#a6e3a1}.neg{color:#f38ba8}.mut{color:#7f849c}
 table{width:100%;border-collapse:collapse;margin-top:6px}
 th,td{text-align:right;padding:6px 10px;border-bottom:1px solid #181b25}
 th{color:#7f849c;font-size:11px;text-transform:uppercase}td:first-child,th:first-child{text-align:left}
 .tag{font-size:11px;padding:1px 6px;border-radius:4px;background:#1e2230}
 .warn{color:#f9e2af;font-size:11px;margin-top:14px}
</style></head><body>
<h1>📈 MACD 5m <span class="mut">— live P&L</span></h1>
<div class="sub">deterministic MACD(12,26,9) intraday on BTC+ETH · <span id="age"></span></div>
<div class="cards" id="cards"></div>
<table><thead><tr><th>coin</th><th>side</th><th>qty</th><th>avg</th><th>mark</th><th>unrealized P&L</th></tr></thead>
<tbody id="rows"></tbody></table>
<div class="warn" id="note"></div>
<script>
const $=id=>document.getElementById(id), cls=v=>v>0?'pos':v<0?'neg':'mut', sgn=v=>(v>0?'+':'')+(+v).toLocaleString(undefined,{maximumFractionDigits:2});
async function load(){
 let d; try{ d=await (await fetch('macd5m.json?t='+Date.now())).json() }catch(e){ $('cards').innerHTML='feed unavailable'; return }
 $('age').textContent='updated '+new Date(d.ts*1000).toLocaleTimeString();
 $('cards').innerHTML=[
  ['Equity','$'+(+d.equity).toLocaleString(),''],
  ['Total P&L','$'+sgn(d.pnl),cls(d.pnl)],
  ['Return',(d.pnl_pct>0?'+':'')+d.pnl_pct+'%',cls(d.pnl_pct)],
  ['Unrealized','$'+sgn(d.unrealized),cls(d.unrealized)],
  ['Realized','$'+sgn(d.realized),cls(d.realized)],
 ].map(c=>`<div class="card"><div class="k">${c[0]}</div><div class="v ${c[2]}">${c[1]}</div></div>`).join('');
 $('rows').innerHTML=(d.positions||[]).map(p=>
  `<tr><td>${p.coin}</td><td><span class="tag">${(p.side||'').toUpperCase()}</span></td><td>${p.qty}</td><td>${(+p.avg).toLocaleString()}</td><td>${(+p.mark).toLocaleString()}</td><td class="${cls(p.uPnL)}">$${sgn(p.uPnL)}</td></tr>`).join('') || '<tr><td colspan=6 class=mut>flat</td></tr>';
 $('note').textContent='⚠ '+(d.note||'')+' — paper, no-fee. The gross MACD edge is fee-sized; net of taker fees this would lose.';
}
load(); setInterval(load, 10000);
</script></body></html>
