<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Combined Portfolio — OpenAlice</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --border: #30363d;
    --text: #e6edf3; --muted: #8b949e; --green: #3fb950; --red: #f85149;
    --accent: #58a6ff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: ui-monospace, 'SF Mono', Menlo, monospace; padding: 24px; }
  h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 20px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .card .value { font-size: 20px; font-weight: 700; }
  .card .meta { color: var(--muted); font-size: 11px; margin-top: 6px; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 12px; text-align: left; font-size: 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 10px; letter-spacing: 0.05em; }
  tr:last-child td { border-bottom: none; }
  .bar { height: 6px; background: var(--accent); border-radius: 3px; min-width: 2px; }
  .refresh { color: var(--muted); font-size: 11px; margin-top: 14px; }
  .err { color: var(--red); font-size: 12px; }
</style>
</head>
<body>
<h1>Combined Portfolio</h1>
<div class="sub">inverse-vol weighted · uncorrelated components · Sharpe 6.21 (audit) vs 5.55 best solo</div>
<div class="grid" id="cards"></div>
<table id="components">
  <thead><tr><th>Component</th><th>Weight</th><th>Equity</th><th>Net</th><th>Status</th></tr></thead>
  <tbody></tbody>
</table>
<div class="refresh" id="refresh"></div>
<script>
const PUB_TOKEN = new URLSearchParams(location.search).get('token') || localStorage.getItem('pub_token') || '';
const withToken = url => url + (PUB_TOKEN ? (url.includes('?') ? '&' : '?') + 'token=' + encodeURIComponent(PUB_TOKEN) : '');

const NAMES = { carry_btc: 'Carry BTC (persistence)', carry_eth: 'Carry ETH (persistence)', smart_trend_btc: 'Smart Trend BTC', trend_btc_1h: 'Trend BTC 1h' };
const fmt = v => v == null ? '—' : Number(v).toLocaleString('en-US', { maximumFractionDigits: 2 });
const cls = v => v == null ? '' : (v >= 0 ? 'pos' : 'neg');

async function load() {
  try {
    const r = await fetch(withToken('combined_portfolio.json?ts=' + Date.now());
    const d = await r.json();
    if (!d.ok) throw new Error(d.error || 'feed not ok');
    const c = d.combined;
    document.getElementById('cards').innerHTML = `
      <div class="card"><div class="label">Combined Equity</div>
        <div class="value ${cls(c.net)}">${fmt(c.equity)}</div>
        <div class="meta">net ${cls(c.net)} ${fmt(c.net)} · ${c.return_pct}% since start</div></div>
      <div class="card"><div class="label">BTC Price</div>
        <div class="value">${fmt(d.price)}</div>
        <div class="meta">proxy for trend legs</div></div>
      <div class="card"><div class="label">Audit Reference</div>
        <div class="value">Sharpe 6.21</div>
        <div class="meta">vs 5.55 best solo · maxDD −0.25%</div></div>`;
    const rows = Object.entries(d.components).map(([name, comp]) => {
      const w = comp.weight || 0;
      const barW = Math.max(2, Math.round(w * 400));
      return `<tr>
        <td>${NAMES[name] || name}<div class="bar" style="width:${barW}px"></div></td>
        <td>${(w * 100).toFixed(1)}%</td>
        <td class="${cls(comp.net)}">${fmt(comp.equity)}</td>
        <td class="${cls(comp.net)}">${fmt(comp.net)}</td>
        <td class="meta">${comp.status || ''}${comp.side != null ? ' · side ' + (comp.side > 0 ? 'LONG' : (comp.side < 0 ? 'SHORT' : 'flat')) : ''}${comp.flips != null ? ' · ' + comp.flips + ' flips' : ''}${comp.trips != null ? ' · ' + comp.trips + ' trips' : ''}</td>
      </tr>`;
    }).join('');
    document.querySelector('#components tbody').innerHTML = rows;
    document.getElementById('refresh').textContent = 'updated ' + d.ts + ' · refreshes every 30s';
  } catch (e) {
    document.getElementById('refresh').innerHTML = '<span class="err">feed error: ' + e.message + '</span>';
  }
}
load();
setInterval(load, 30000);
</script>
</body>
</html>
