<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#000000"/>
<link rel="icon" href="/favicon.svg" type="image/svg+xml"/>
<title>OPENALICE · SCREENER</title>
<style>
  :root{--bg:#000;--amber:#ffa028;--orange:#ff7a00;--white:#eaeaea;--grn:#46e34a;--red:#ff4d4d;--dim:#6b6b6b;--cyan:#37b6ff;--line:#181818}
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--amber);font:13px/1.35 'SF Mono',Menlo,monospace}
  .top{display:flex;align-items:center;gap:10px;border-bottom:2px solid var(--orange);padding:6px 12px;flex-wrap:wrap}
  .brand{color:#000;background:var(--orange);font-weight:700;letter-spacing:1px;padding:2px 9px}
  .nav a{color:var(--dim)}.nav a.on{color:var(--grn);font-weight:700}.nav{display:flex;gap:8px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th{color:var(--cyan);text-align:left;text-transform:uppercase;font-size:11px;padding:5px 10px;border-bottom:1px solid var(--orange)}
  td{padding:4px 10px;border-bottom:1px solid var(--line)}
  tr:hover td{background:#0e0b03}
  .pos{color:var(--grn)}.neg{color:var(--red)}.dim{color:var(--dim)}
  .tag{font-size:10px;padding:1px 6px;border-radius:8px;border:1px solid var(--line)}
  .tag.L{color:var(--grn);border-color:#1d5c1f}.tag.S{color:var(--red);border-color:#5c1d1d}
  .heat{display:inline-block;width:100%;min-width:52px;text-align:center;border-radius:4px;padding:1px 0}
  .foot{border-top:1px solid var(--orange);color:var(--amberdim);padding:7px 12px;font-size:11px;display:flex;gap:14px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="top"><span class="brand">OPENALICE</span>
<span class="nav"><a href="/pipeline.html">PIPELINE</a> · <a href="/chart.html">CHART</a> · <a href="/legs.html">LEGS</a> · <a href="/tournament.html">TOURNAMENT</a> · <a class="on" href="/screener.html">SCREENER</a></span>
<span class="dim" id="ts" style="margin-left:auto">--:--:--</span></div>
<table id="t">
<thead><tr><th>coin</th><th style="text-align:right">price</th><th style="text-align:right">24h</th><th style="text-align:right">RSI 1h</th><th>trend</th><th>vol rank</th><th style="text-align:right">score</th><th>tag</th></tr></thead>
<tbody></tbody>
</table>
<div class="foot">
  <span>HONEST: raw metrics only · trend = ema24 vs ema96 on 1h · score is a dumb sum, not a signal</span>
  <a href="/pipeline.html">PIPELINE</a>
</div>
<script>
function heat(v){ // v in [-4..4]
  const i=Math.min(Math.max(Math.round((v+4)/8*9),0),8);
  const g=['#3a0a0a','#4d1010','#5c1d1d','#6b3010','#33280a','#1d3310','#14401a','#0f521f',' #0b6623'][i];
  const c=v>=1?'var(--grn)':(v<=-1?'var(--red)':'var(--white)');
  return `<span class="heat" style="background:${g.trim()};color:${c}">${v>0?'+':''}${v}</span>`;
}
async function tick(){
  let d; try{ d=await(await fetch('/pipeline.json?_='+Date.now())).json(); }catch(e){ document.getElementById('ts').textContent='NO FEED'; return; }
  document.getElementById('ts').textContent=(d.screener?.ts||'').slice(11);
  const tb=document.querySelector('#t tbody'); tb.innerHTML='';
  for(const c of (d.screener?.coins||[])){
    const cls=c.chg24h>=0?'pos':'neg';
    const tcls=c.tag&&c.tag.startsWith('LONG')?'L':(c.tag&&c.tag.startsWith('SHORT')?'S':'');
    tb.innerHTML+=`<tr>
      <td>${c.sym}</td>
      <td style="text-align:right">${Number(c.price).toLocaleString(undefined,{maximumFractionDigits:c.price<10?4:1})}</td>
      <td style="text-align:right" class="${cls}">${c.chg24h>0?'+':''}${c.chg24h}%</td>
      <td style="text-align:right" class="${c.rsi>70?'neg':(c.rsi<30?'pos':'')}">${c.rsi}</td>
      <td class="${c.trend==='UP'?'pos':'neg'}">${c.trend}</td>
      <td class="dim">${c.vol_rank!=null?c.vol_rank+'pct':'—'}</td>
      <td style="text-align:right">${heat(c.score||0)}</td>
      <td><span class="tag ${tcls}">${c.tag||''}</span></td>
    </tr>`;
  }
}
tick(); setInterval(tick,20000);
</script>
</body>
</html>
