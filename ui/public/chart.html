<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>OPENALICE · BTC &lt;GO&gt; · CHART</title>
<style>
  :root{--bg:#000;--amber:#ffa028;--orange:#ff7a00;--amberdim:#9c6f1e;--white:#eaeaea;
        --grn:#2bd96b;--red:#ff4d4d;--dim:#6b6b6b;--cyan:#37b6ff;--line:#141414}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--amber);
       font:12px/1.3 'SF Mono','Consolas','Menlo','Monaco','Courier New',monospace;overflow:hidden}
  .top{display:flex;align-items:center;gap:12px;background:#000;border-bottom:2px solid var(--orange);padding:6px 12px}
  .brand{color:#000;background:var(--orange);font-weight:700;letter-spacing:1px;padding:2px 9px}
  .tkr{color:var(--white);font-weight:700;font-size:15px;letter-spacing:1px}
  .last{font-size:15px;font-weight:700}.chg{font-size:12px}
  .pos{color:var(--grn)}.neg{color:var(--red)}.dim{color:var(--dim)}
  .periods{display:flex;gap:0;margin-left:6px}
  .periods button{background:#000;color:var(--amberdim);border:1px solid var(--line);font:inherit;
     padding:2px 9px;cursor:pointer;text-transform:uppercase}
  .periods button.on{color:#000;background:var(--orange);border-color:var(--orange);font-weight:700}
  .live{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--grn)}
  .blink{width:8px;height:8px;border-radius:50%;background:var(--grn);animation:bl 1.1s steps(2,end) infinite}
  @keyframes bl{50%{opacity:.15}}
  .tape{overflow:hidden;white-space:nowrap;border-bottom:1px solid var(--line);height:26px}
  .trk{display:inline-block;padding:5px 0;animation:scroll 36s linear infinite;will-change:transform}
  .tape:hover .trk{animation-play-state:paused}
  @keyframes scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
  .tk{padding:0 18px;color:var(--amberdim)}.tk b{color:var(--white)}.tk .u{color:var(--grn)}.tk .d{color:var(--red)}
  .wrap{position:relative;height:calc(100% - 61px);display:flex}
  #c{flex:1;height:100%;display:block;min-width:0}
  .ob{width:190px;border-left:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
  .ob .h{color:var(--cyan);font-size:10px;text-transform:uppercase;letter-spacing:.5px;padding:3px 8px;border-bottom:1px solid var(--line)}
  .ob .rows{flex:1;display:flex;flex-direction:column;justify-content:center;font-size:11px}
  .ob .r{position:relative;display:flex;justify-content:space-between;padding:1px 8px;font-variant-numeric:tabular-nums}
  .ob .r .b{position:absolute;top:0;bottom:0;right:0;opacity:.16}
  .ob .r span{position:relative;z-index:1}
  .ob .ask .px{color:var(--red)}.ob .ask .b{background:var(--red)}
  .ob .bid .px{color:var(--grn)}.ob .bid .b{background:var(--grn)}
  .ob .sz{color:var(--amberdim)}
  .ob .mid{padding:3px 8px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;color:var(--white);font-weight:700}
  .ohlc{position:absolute;left:10px;top:8px;color:var(--amberdim);font-size:12px;pointer-events:none;
        text-shadow:0 0 4px #000;letter-spacing:.5px}
  .ohlc b{font-weight:700}
  .legend{position:absolute;left:10px;top:26px;font-size:11px;pointer-events:none}
  .foot{position:absolute;right:10px;bottom:24px;color:var(--amberdim);font-size:10px}
</style>
</head>
<body>
<div class="top">
  <span class="brand">OPENALICE</span>
  <span class="tkr" id="tkr">BTCUSD</span>
  <span class="last" id="last">—</span><span class="chg" id="chg"></span>
  <span class="periods" id="symbols"></span>
  <span class="periods" id="periods"></span>
  <span class="live"><span class="blink"></span><span id="ts">--:--:--</span></span>
</div>
<div class="tape"><div class="trk" id="tape">loading tape…</div></div>
<div class="wrap">
  <canvas id="c"></canvas>
  <div class="ob" id="ob"></div>
  <div class="ohlc" id="ohlc"></div>
  <div class="legend"><span style="color:var(--amber)">━ EMA20</span> &nbsp; <span style="color:var(--cyan)">━ EMA50</span></div>
</div>
<script>
const C=document.getElementById('c'), X=C.getContext('2d');
let DATA=[], INTERVAL='1h', SYMBOL='BTC', HOVER=-1;
const PERIODS=['15m','1h','4h','1d'], SYMBOLS=['BTC','ETH','SOL'];
const TAPE=['BTC','ETH','SOL','BNB','XRP','DOGE','ADA','AVAX'], tdata={};
const SY=document.getElementById('symbols');
SY.innerHTML=SYMBOLS.map(s=>`<button class="${s===SYMBOL?'on':''}" data-s="${s}">${s}</button>`).join('');
SY.onclick=e=>{const s=e.target.dataset.s; if(s&&s!==SYMBOL){const o=SYMBOL; SYMBOL=s; document.querySelectorAll('#symbols button').forEach(b=>b.classList.toggle('on',b.dataset.s===s)); document.getElementById('tkr').textContent=s+'USD'; switchStream(o,INTERVAL,s,INTERVAL); load();}};
document.getElementById('periods').innerHTML=PERIODS.map(p=>`<button class="${p===INTERVAL?'on':''}" data-p="${p}">${p}</button>`).join('');
document.getElementById('periods').onclick=e=>{const p=e.target.dataset.p; if(p&&p!==INTERVAL){const o=INTERVAL; INTERVAL=p; document.querySelectorAll('#periods button').forEach(b=>b.classList.toggle('on',b.dataset.p===p)); switchStream(SYMBOL,o,SYMBOL,p); load();}};
function renderTape(){
  const items=TAPE.map(s=>{const t=tdata[s]; if(!t)return ''; const up=t.pct>=0;
    return `<span class="tk">${s} <b>$${t.price.toLocaleString(undefined,{maximumFractionDigits:(t.price<10?4:0)})}</b> <span class="${up?'u':'d'}">${up?'▲':'▼'}${Math.abs(t.pct).toFixed(2)}%</span></span>`;}).join('');
  if(items.trim()) document.getElementById('tape').innerHTML=items+items;
}
function renderOB(bids,asks){
  if(!bids||!asks||!bids.length||!asks.length)return;
  const A=asks.slice(0,12).map(a=>[+a[0],+a[1]]), B=bids.slice(0,12).map(b=>[+b[0],+b[1]]);
  let ca=0,cb=0; const ac=A.map(a=>ca+=a[1]), bc=B.map(b=>cb+=b[1]), mx=Math.max(ca,cb)||1;
  const bA=A[0][0], bB=B[0][0], mid=(bA+bB)/2, spr=bA-bB, dp=mid<10?4:1;
  const pf=n=>n.toLocaleString(undefined,{maximumFractionDigits:dp});
  const ar=A.map((a,i)=>`<div class="r ask"><div class="b" style="width:${ac[i]/mx*100}%"></div><span class="px">${pf(a[0])}</span><span class="sz">${a[1].toFixed(3)}</span></div>`).reverse().join('');
  const br=B.map((b,i)=>`<div class="r bid"><div class="b" style="width:${bc[i]/mx*100}%"></div><span class="px">${pf(b[0])}</span><span class="sz">${b[1].toFixed(3)}</span></div>`).join('');
  document.getElementById('ob').innerHTML=`<div class="h">Order Book · ${SYMBOL} · live</div><div class="rows">${ar}<div class="mid"><span>${pf(mid)}</span><span class="sz">spr ${spr.toFixed(spr<1?3:1)}</span></div>${br}</div>`;
}

function ema(vals,p){const k=2/(p+1);let e=vals[0],out=[e];for(let i=1;i<vals.length;i++){e=vals[i]*k+e*(1-k);out.push(i<p-1?null:e);}return out;}
async function load(){
  let rows=null;
  try{ // Binance direct (CORS-open) — enables symbol + period switching
    const r=await fetch(`https://api.binance.com/api/v3/klines?symbol=${SYMBOL}USDT&interval=${INTERVAL}&limit=180`);
    const j=await r.json(); rows=j.map(k=>({t:+k[0],o:+k[1],h:+k[2],l:+k[3],c:+k[4],v:+k[5]}));
  }catch(e){
    if(SYMBOL==='BTC'){ try{ const j=await (await fetch('/candles.json?_='+Date.now())).json();
         rows=j.candles.map(k=>({t:k[0],o:k[1],h:k[2],l:k[3],c:k[4],v:k[5]})); }catch(_){} }
  }
  if(rows&&rows.length){DATA=rows; draw();}
}
function fmt(n){return '$'+Number(n).toLocaleString(undefined,{maximumFractionDigits:n<10?4:0});}
function tlabel(t){const d=new Date(t);const p=x=>String(x).padStart(2,'0');
  return (INTERVAL==='1d')?`${p(d.getMonth()+1)}/${p(d.getDate())}`:`${p(d.getHours())}:${p(d.getMinutes())}`;}

function draw(){
  const dpr=window.devicePixelRatio||1, W=C.clientWidth, H=C.clientHeight;
  const pw=Math.round(W*dpr), ph=Math.round(H*dpr);
  if(C.width!==pw||C.height!==ph){C.width=pw; C.height=ph;}   // only rebuild bitmap on real size change
  X.setTransform(dpr,0,0,dpr,0,0);
  X.clearRect(0,0,W,H); if(!DATA.length)return;
  const AX=64, BT=22, TP=6, LF=6;                 // right axis, bottom time, paddings
  const cw=(W-AX-LF)/DATA.length;
  const pricH=(H-BT-TP)*0.76, volTop=TP+pricH+6, volH=(H-BT)-volTop;
  let lo=Math.min(...DATA.map(d=>d.l)), hi=Math.max(...DATA.map(d=>d.h));
  const pad=(hi-lo)*0.06; lo-=pad; hi+=pad;
  const Y=p=>TP+(hi-p)/(hi-lo)*pricH;
  const xC=i=>LF+i*cw+cw/2;
  const maxV=Math.max(...DATA.map(d=>d.v));
  // grid + price axis
  X.font="10px 'SF Mono',monospace"; X.textBaseline='middle';
  for(let g=0;g<=6;g++){const p=lo+(hi-lo)*g/6, y=Y(p);
    X.strokeStyle='#141414'; X.setLineDash([1,3]); X.beginPath(); X.moveTo(LF,y); X.lineTo(W-AX,y); X.stroke(); X.setLineDash([]);
    X.fillStyle='#9c6f1e'; X.textAlign='left'; X.fillText(fmt(p), W-AX+5, y);}
  // time axis
  const step=Math.ceil(DATA.length/8);
  X.textAlign='center';
  for(let i=0;i<DATA.length;i+=step){const x=xC(i);
    X.strokeStyle='#101010'; X.setLineDash([1,3]); X.beginPath(); X.moveTo(x,TP); X.lineTo(x,TP+pricH); X.stroke(); X.setLineDash([]);
    X.fillStyle='#9c6f1e'; X.fillText(tlabel(DATA[i].t), x, H-BT+11);}
  // volume
  DATA.forEach((d,i)=>{const x=xC(i), h=Math.max(1,(d.v/maxV)*volH);
    X.fillStyle=d.c>=d.o?'rgba(43,217,107,.35)':'rgba(255,77,77,.35)';
    X.fillRect(x-Math.max(1,cw*0.34), (volTop+volH-h), Math.max(1,cw*0.68), h);});
  // candles
  DATA.forEach((d,i)=>{const x=xC(i), up=d.c>=d.o, col=up?'#2bd96b':'#ff4d4d';
    X.strokeStyle=col; X.fillStyle=col; X.lineWidth=1;
    X.beginPath(); X.moveTo(x,Y(d.h)); X.lineTo(x,Y(d.l)); X.stroke();
    const yo=Y(d.o), yc=Y(d.c), bw=Math.max(1,cw*0.62);
    X.fillRect(x-bw/2, Math.min(yo,yc), bw, Math.max(1,Math.abs(yc-yo)));});
  // EMAs
  const cl=DATA.map(d=>d.c);
  [[20,'#ffa028'],[50,'#37b6ff']].forEach(([p,col])=>{const e=ema(cl,p);
    X.strokeStyle=col; X.lineWidth=1.2; X.beginPath(); let started=false;
    e.forEach((v,i)=>{if(v==null)return; const x=xC(i),y=Y(v); if(!started){X.moveTo(x,y);started=true;}else X.lineTo(x,y);}); X.stroke();});
  // last price line + tag
  const lp=DATA[DATA.length-1].c, prev=DATA[DATA.length-2]?.c??lp, up=lp>=prev, y=Y(lp);
  X.strokeStyle=up?'#2bd96b':'#ff4d4d'; X.setLineDash([3,3]); X.lineWidth=1;
  X.beginPath(); X.moveTo(LF,y); X.lineTo(W-AX,y); X.stroke(); X.setLineDash([]);
  X.fillStyle=up?'#2bd96b':'#ff4d4d'; X.fillRect(W-AX, y-8, AX-2, 16);
  X.fillStyle='#000'; X.textAlign='left'; X.font="bold 10px 'SF Mono',monospace"; X.fillText(fmt(lp), W-AX+4, y);
  // crosshair + readout
  const hv=(HOVER>=0&&HOVER<DATA.length)?DATA[HOVER]:DATA[DATA.length-1];
  if(HOVER>=0){const x=xC(HOVER);
    X.strokeStyle='#6b6b6b'; X.setLineDash([2,3]);
    X.beginPath(); X.moveTo(x,TP); X.lineTo(x,H-BT); X.stroke();
    if(window._my!=null){X.beginPath(); X.moveTo(LF,window._my); X.lineTo(W-AX,window._my); X.stroke();}
    X.setLineDash([]);}
  const u=hv.c>=hv.o, col=u?'#2bd96b':'#ff4d4d';
  document.getElementById('ohlc').innerHTML=
    `<b style="color:${col}">O</b> ${fmt(hv.o)} &nbsp;<b style="color:${col}">H</b> ${fmt(hv.h)} &nbsp;`+
    `<b style="color:${col}">L</b> ${fmt(hv.l)} &nbsp;<b style="color:${col}">C</b> <span style="color:${col}">${fmt(hv.c)}</span> &nbsp;`+
    `<b style="color:#37b6ff">VOL</b> ${hv.v.toFixed(1)}`;
  const ch=lp-prev, pct=prev?ch/prev*100:0;
  document.getElementById('last').textContent=fmt(lp);
  document.getElementById('last').className='last '+(up?'pos':'neg');
  document.getElementById('chg').textContent=`${ch>=0?'+':''}${ch.toFixed(1)} (${pct>=0?'+':''}${pct.toFixed(2)}%)`;
  document.getElementById('chg').className='chg '+(up?'pos':'neg');
  document.getElementById('ts').textContent=new Date().toTimeString().slice(0,8);
}
let _raf=0; function schedule(){ if(_raf)return; _raf=requestAnimationFrame(()=>{_raf=0; draw();}); }
C.addEventListener('mousemove',e=>{ if(!DATA.length)return; const r=C.getBoundingClientRect(), W=C.clientWidth;
  const LF=6,AX=64,cw=(W-LF-AX)/DATA.length;
  const idx=Math.max(0,Math.min(DATA.length-1,Math.floor((e.clientX-r.left-LF)/cw))), my=e.clientY-r.top;
  if(idx===HOVER && Math.abs((window._my||0)-my)<2) return;   // same candle, negligible move → skip
  HOVER=idx; window._my=my; schedule(); });
C.addEventListener('mouseleave',()=>{ HOVER=-1; window._my=null; schedule(); });
let _rz; window.addEventListener('resize',()=>{ clearTimeout(_rz); _rz=setTimeout(schedule,120); });
// ── Market-live WebSocket streams (Binance public, keyless, ~real-time) ──
let WS=null,_obr=0; const lc=s=>s.toLowerCase()+'usdt';
function strk(sym,intv){return [lc(sym)+'@kline_'+intv, lc(sym)+'@depth20@100ms'];}
function wsend(method,params){if(WS&&WS.readyState===1)WS.send(JSON.stringify({method,params,id:Math.floor(Math.random()*1e6)}));}
function switchStream(oS,oI,nS,nI){wsend('UNSUBSCRIBE',strk(oS,oI));wsend('SUBSCRIBE',strk(nS,nI));}
function connect(){
  WS=new WebSocket('wss://stream.binance.com:9443/stream');
  WS.onopen=()=>wsend('SUBSCRIBE',[...strk(SYMBOL,INTERVAL),...TAPE.map(s=>lc(s)+'@miniTicker')]);
  WS.onmessage=ev=>{let m;try{m=JSON.parse(ev.data);}catch(_){return;} const d=m.data,st=m.stream||''; if(!d)return;
    if(d.e==='kline'){ if(d.k.s.replace('USDT','')!==SYMBOL)return; const k=d.k,bar={t:+k.t,o:+k.o,h:+k.h,l:+k.l,c:+k.c,v:+k.v};
      if(DATA.length&&DATA[DATA.length-1].t===bar.t)DATA[DATA.length-1]=bar;
      else if(DATA.length&&bar.t>DATA[DATA.length-1].t){DATA.push(bar);if(DATA.length>180)DATA.shift();}
      schedule(); }
    else if(d.e==='24hrMiniTicker'){ const s=d.s.replace('USDT',''); tdata[s]={price:+d.c,pct:(+d.o?(+d.c/+d.o-1)*100:0)}; renderTape(); }
    else if(d.bids&&d.asks){ if(st&&!st.startsWith(lc(SYMBOL)))return; if(!_obr)_obr=requestAnimationFrame(()=>{_obr=0;renderOB(d.bids,d.asks);}); }
  };
  WS.onclose=()=>setTimeout(connect,1500);          // auto-reconnect
  WS.onerror=()=>{try{WS.close();}catch(_){}};
}
load().then(connect); setInterval(load,60000);      // WS = live; REST resync hourly-bar history each 60s to self-heal gaps
</script>
</body>
</html>
